# Mouse (and any pointer): acceleration
Section "InputClass"
    Identifier "pointer defaults"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelSpeed" "0.6"
EndSection

# Touchpad: tap-to-click, corner-zone clicks
# (listed after the pointer section so it wins for the touchpad)
Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "ClickMethod" "buttonareas"
    Option "DisableWhileTyping" "on"
    Option "AccelSpeed" "0.6"
EndSection

# Touchscreen: disabled
Section "InputClass"
    Identifier "ignore touchscreen"
    MatchProduct "Wacom HID 5074 Finger"
    Option "Ignore" "on"
EndSection
